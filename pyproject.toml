[project]
name = "OpenVerse"
version = "0.1.0"
description = ""
authors = [
    {name = "Javicle", email = "supergamer.08.2006@gmail.com"}
]

requires-python = ">=3.14,<4.0"
dependencies = [
    "redis (>=7.0.0,<8.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "taskiq (>=0.12.4,<0.13.0)",
    "taskiq-redis (>=1.2.2,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)"
]


[tool.poetry]
package-mode = false



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --- НАСТРОЙКА RUFF ---
[tool.ruff]
target-version = "py314"
line-length = 88
# Исключаем лишние директории из проверки
exclude = [".venv", "alembic", ".git", "__pycache__", "tests"]

[tool.ruff.lint]
select = ["ALL"]

fixable = ["ALL"]
ignore = ["D", "COM", "B008", "TC001", "TC003", "RUF002", "TC002", "CPY001"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# --- НАСТРОЙКА PYRIGHT ---
[tool.pyright]
venvPath = "."
extraPaths = ["src"]
venv = ".venv"
pythonVersion = '3.14'
reportUnusedVariable = false
reportUnusedImport = false
reportUnusedCallResult = false

[dependency-groups]
dev = [
    "ruff (>=0.15.16,<0.16.0)",
    "pyright (>=1.1.410,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
